<!doctype html>
<html lang="or">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Rice Buy & Sell Register</title>
<style>
:root{--bg:#000;--panel:#0b0b0b;--panel2:#111;--text:#fff;--muted:#8e8e93;--line:#292929;--soft:#171717;--radius:22px;--shadow:0 12px 35px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh;background:#000}
.sidebar{background:#050505;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;color:#000;display:grid;place-items:center;font-size:21px}
.brand b{display:block;font-size:14px}.brand small{color:var(--muted);font-size:11px}
.group{color:#707070;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:12px 10px 6px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{border:1px solid transparent;background:transparent;color:#fff;text-align:left;padding:11px;border-radius:14px;display:flex;gap:10px;align-items:center;font-weight:650}
.nav button:hover{background:#111}.nav button.active{background:#fff;color:#000;border-color:#fff}
.nav .ic{width:22px;text-align:center}
.main{width:100%;max-width:1500px;padding:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.title{display:flex;align-items:center;gap:10px}.title h1{font-size:20px;letter-spacing:-.03em}.menu{display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:14px;border:1px solid #333;background:#111;color:#fff;font-weight:700}
.btn:hover{background:#1b1b1b}.btn.primary{background:#fff;color:#000;border-color:#fff}.btn.primary:hover{background:#e9e9e9}.btn.sm{padding:7px 11px;font-size:12px}
.badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid #333;background:#111;color:#fff;font-size:12px}.badge.rice{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:repeat(2,1fr)}
.card{background:#0b0b0b;border:1px solid #292929;border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.kpi{min-height:125px;display:flex;flex-direction:column;justify-content:space-between}.kpi .lbl{font-size:12px;color:#bdbdbd}.kpi .val{font-size:28px;font-weight:850;letter-spacing:-.04em}.kpi .sub{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{border:1px solid #292929;background:#0f0f0f;color:#fff;border-radius:18px;padding:16px;text-align:left}.quick button:hover{background:#171717;border-color:#555}.quick b{display:block;margin-top:8px}.quick small{display:block;color:var(--muted);margin-top:3px}
h2,h3{margin:0 0 5px;letter-spacing:-.025em}.muted,small{color:var(--muted)}
.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center}.row label{font-weight:650}
input,select,textarea{width:100%;background:#111;color:#fff;border:1px solid #333;border-radius:14px;padding:11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.1)}
.party-picker{position:relative}.party-picker input{width:100%}.party-suggest{position:absolute;z-index:100;left:0;right:0;top:calc(100% + 5px);background:#0b0b0b;border:1px solid #444;border-radius:14px;max-height:240px;overflow:auto;display:none;box-shadow:var(--shadow)}.party-suggest.show{display:block}.party-suggest .item{padding:11px 13px;border-bottom:1px solid #222}.party-suggest .item:hover{background:#1b1b1b}.party-suggest small{display:block}
.party-status{font-size:12px;color:var(--muted);margin-top:6px}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.calc .box{background:#111;border:1px solid #292929;border-radius:16px;padding:13px}.calc small{display:block}.calc b{font-size:20px;display:block;margin-top:4px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.grow{flex:1}
.table-wrap{overflow:auto;border:1px solid #292929;border-radius:16px}.data{border-collapse:collapse;width:100%;min-width:780px;font-size:13px}.data th,.data td{padding:10px;border-bottom:1px solid #242424;text-align:left;white-space:nowrap}.data th{background:#111;position:sticky;top:0}.data td.num{text-align:right}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff;color:#000;font-size:11px;font-weight:750}.pill.dark{background:#222;color:#fff;border:1px solid #444}
.party-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.party{background:#101010;border:1px solid #292929;border-radius:18px;padding:14px}.party .name{font-weight:800}.party .meta{font-size:12px;color:var(--muted);margin-top:5px}.party .amount{font-size:17px;font-weight:800;margin-top:10px}
.empty{text-align:center;padding:35px;color:var(--muted)}
.toast{position:fixed;right:16px;bottom:22px;z-index:200;background:#fff;color:#000;border-radius:14px;padding:11px 15px;font-weight:700;box-shadow:var(--shadow)}
.bottom{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:90;left:0;top:0;width:78%;max-width:320px;transform:translateX(-105%);transition:.18s}.sidebar.open{transform:none}.main{padding:14px 12px 88px}.menu{display:inline-flex}.k4{grid-template-columns:repeat(2,1fr)}.k3,.k2{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.party-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.calc{grid-template-columns:1fr 1fr}.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:80;background:#050505;border-top:1px solid #292929;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.bottom button{flex:1;border:0;background:transparent;color:#888;padding:7px 2px;font-size:11px}.bottom button.active{color:#fff}.bottom span{display:block;font-size:17px;margin-bottom:2px}}
@media(max-width:430px){.k4{grid-template-columns:1fr 1fr}.calc{grid-template-columns:1fr}.kpi .val{font-size:24px}}
@media print{body{background:#fff;color:#000}.sidebar,.topbar,.bottom,.no-print{display:none!important}.main{padding:0}.card{background:#fff;color:#000;border:1px solid #111;box-shadow:none}.data th,.data td{color:#000;background:#fff;border-color:#111}}
</style>
</head>

</header>
<div id="root"></div>
</main>
</div>
<nav class="bottom">
<button data-page="dashboard"><span>⌂</span><span data-i18n="dashboard"></span></button>
<button data-page="purchase"><span>↓</span><span data-i18n="purchase"></span></button>
<button data-page="sale"><span>↑</span><span data-i18n="sale"></span></button>
<button data-page="history"><span>▤</span><span data-i18n="history"></span></button>
<button data-page="stock"><span>□</span><span data-i18n="stock"></span></button>
</nav>

async function post(x){return apiJson(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(x)})}

function applyLanguage(){
  document.documentElement.lang=lang;

  $$("[data-i18n]").forEach(x=>x.textContent=t(x.dataset.i18n));

async function refreshAll(){
  try{
    const [pa,pu,sa,da]=await Promise.all([get("parties"),get("purchases"),get("sales"),get("dashboard")]);
    parties=arr(pa);purchases=arr(pu);sales=arr(sa);dashboardData=da?.data&&!Array.isArray(da.data)?da.data:{};
    draw();
  }catch(e){console.error(e);toast(t("connectionFailed")+": "+e.message)}
}
function dashboard(){
  const d=dashboardData||{};
  const pq=num(d.purchaseQty),sq=num(d.salesQty),pv=num(d.purchaseValue),sv=num(d.salesValue),pd=num(d.purchaseDue),sd=num(d.salesDue),st=num(d.currentStock);
  return `<div class="grid k4">
  <div class="card kpi"><span class="lbl">↓ ${t("purchaseQty")}</span><span class="val">${kg(pq)} KG</span><span class="sub">${money(pv)}</span></div>
  <div class="card kpi"><span class="lbl">↑ ${t("salesQty")}</span><span class="val">${kg(sq)} KG</span><span class="sub">${money(sv)}</span></div>
  <div class="card kpi"><span class="lbl">₹ ${t("payable")}</span><span class="val">${money(pd)}</span><span class="sub">${t("toSuppliers")}</span></div>
  <div class="card kpi"><span class="lbl">₹ ${t("receivable")}</span><span class="val">${money(sd)}</span><span class="sub">${t("fromCustomers")}</span></div></div>
  <div style="height:12px"></div>
  <div class="card"><div class="toolbar"><div class="grow"><h3>${t("quickActions")}</h3><small>${t("fixedRice")}</small></div><span class="badge">${navigator.onLine?"● "+t("online"):"● "+t("offline")}</span></div>
  <div class="quick"><button onclick="setPage('purchase')">↓<b>${t("newPurchase")}</b><small>${t("fromSupplier")}</small></button><button onclick="setPage('sale')">↑<b>${t("newSale")}</b><small>${t("toCustomer")}</small></button><button onclick="setPage('history')">▤<b>${t("transactions")}</b><small>${t("records")}</small></button><button onclick="setPage('parties')">♟<b>${t("parties")}</b><small>${t("allParties")}</small></button></div></div>
  <div style="height:12px"></div>
  <div class="grid k2"><div class="card"><h3>□ ${t("stockPosition")}</h3><div style="font-size:34px;font-weight:850;margin-top:10px">${kg(st)} KG</div><small>${t("purchaseMinusSales")}</small></div>
  <div class="card"><h3>▤ ${t("todayFocus")}</h3><div style="display:grid;gap:8px;margin-top:12px"><button class="btn" onclick="setPage('history')">⌕ ${t("checkDues")}</button><button class="btn" onclick="setPage('print')">▣ ${t("printRegister")}</button></div></div></div>`;
}
function partyPicker(type){
 const sale=type==="sale";
 return `<div class="party-picker"><input name="partyNameInput" id="partyNameInput" required autocomplete="off" placeholder="${t("typeParty")}"><input type="hidden" name="partyId" id="partyId"><div id="partySuggest" class="party-suggest"></div><div id="partyStatus" class="party-status">${t("oldPartyHint")}</div></div>`;
}
function bindPartyPicker(){
 const input=$("#partyNameInput"),hidden=$("#partyId"),box=$("#partySuggest"),status=$("#partyStatus");if(!input)return;
 function render(){const q=input.value.trim().toLowerCase();hidden.value="";if(!q){box.classList.remove("show");status.textContent=t("oldPartyHint");return}
  const m=parties.filter(p=>partyNameOf(p).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=m.map(p=>`<div class="item" data-id="${esc(partyIdOf(p))}" data-name="${esc(partyNameOf(p))}"><b>${esc(partyNameOf(p))}</b><small>${esc(partyIdOf(p))}</small></div>`).join("");
  box.innerHTML+=`<div class="item" data-new="1">＋ ${t("addNew")}: <b>${esc(input.value.trim())}</b></div>`;
  box.classList.add("show");status.textContent=m.length?t("selectParty"):t("newPartySave");
 }
 input.addEventListener("input",render);input.addEventListener("focus",render);
 box.addEventListener("click",e=>{let item=e.target.closest(".item");if(!item)return;if(item.dataset.id){input.value=item.dataset.name;hidden.value=item.dataset.id;status.textContent=t("selected")+": "+item.dataset.id}else{hidden.value="";status.textContent=t("newPartySave")}box.classList.remove("show")});
 document.addEventListener("click",e=>{if(!e.target.closest(".party-picker"))box.classList.remove("show")});
}
function form(type){
 const sale=type==="sale";
 return `<div class="card"><div class="toolbar"><div class="grow"><h2>${sale?t("newSale"):t("newPurchase")}</h2><small>${t("rice")}</small></div><span class="badge rice">${sale?"↑":"↓"}</span></div>
 <form class="form" onsubmit="saveEntry(event,'${type}')">
 <div class="row"><label>${t("date")}</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="row"><label>${sale?t("customer"):t("supplier")}</label>${partyPicker(type)}</div>
 <input type="hidden" name="riceId" value="R001"><input type="hidden" name="riceName" value="NORMAL RICE">
 <div class="row"><label>${t("qty")}</label><input id="qty" name="qty" type="number" min="0" step=".01" required placeholder="0.00"></div>
 <div class="row"><label>${t("rate")}</label><input id="rate" name="rate" type="number" min="0" step=".01" required placeholder="0.00"></div>
 <div class="calc"><div class="box"><small>${t("total")}</small><b id="total">₹0</b></div><div class="box"><small>${sale?t("received"):t("paid")}</small><input id="paid" name="${sale?"received":"paid"}" type="number" min="0" step=".01" value="0"></div><div class="box"><small>${t("due")}</small><b id="due">₹0</b></div></div>
 <div class="row"><label>${t("paymentMode")}</label><select name="paymentMode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Other</option></select></div>
 <div class="row"><label>${t("remarks")}</label><textarea name="remarks" rows="2" placeholder="${t("optional")}"></textarea></div>
 <div class="actions"><button class="btn primary" type="submit">✓ ${sale?t("saveSale"):t("savePurchase")}</button><button type="button" class="btn" onclick="setPage('history')">▤ ${t("viewHistory")}</button></div>
 </form></div>`;
}
function bindCalc(){bindPartyPicker();["qty","rate","paid"].forEach(id=>$("#"+id)?.addEventListener("input",()=>{let total=(+$("#qty").value||0)*(+$("#rate").value||0),paid=+$("#paid").value||0;$("#total").textContent=money(total);$("#due").textContent=money(Math.max(0,total-paid))}))}
function newPartyId(){return"P-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase()}
async function saveEntry(e,type){
 e.preventDefault();const x=Object.fromEntries(new FormData(e.target));let partyName=String(x.partyNameInput||"").trim(),partyId=String(x.partyId||"").trim();if(!partyName){toast(t("partyRequired"));return}
 const existing=parties.find(p=>partyNameOf(p).trim().toLowerCase()===partyName.toLowerCase());
 if(!partyId&&existing){partyId=partyIdOf(existing)}
 if(!partyId){partyId=newPartyId();try{let r=await post({action:"addParty",partyId,partyName,"Party ID":partyId,"Party Name":partyName,type:type==="sale"?"Customer":"Supplier","Party Type":type==="sale"?"Customer":"Supplier"});partyId=r.partyId||r.data?.partyId||partyId;parties.push({"Party ID":partyId,"Party Name":partyName,"Party Type":type==="sale"?"Customer":"Supplier"});toast(t("partySaved"))}catch(err){toast(t("entryFailed")+": "+err.message);return}}
 const q=num(x.qty),rate=num(x.rate),total=q*rate,p=type==="sale"?num(x.received):num(x.paid),due=Math.max(0,total-p);
 const payload={action:type==="sale"?"addSale":"addPurchase",type:type==="sale"?"Sale":"Purchase",date:x.date,partyId,partyName,riceId:"R001",riceName:"NORMAL RICE",qty:q,rate,total,paid:type==="sale"?0:p,received:type==="sale"?p:0,due,paymentMode:x.paymentMode||"Cash",remarks:x.remarks||""};
 try{await post(payload);toast(t("entrySaved"));await refreshAll();setPage("history")}catch(err){console.error(err);toast(t("entryFailed")+": "+err.message)}
}
function history(){
 const rows=[...purchases.map(x=>({...x,__type:"Purchase"})),...sales.map(x=>({...x,__type:"Sale"}))];
 return `<div class="card"><div class="toolbar"><div class="grow"><h2>${t("historyTitle")}</h2><small>${rows.length} ${t("records")}</small></div><input id="search" style="max-width:260px" placeholder="${t("searchParty")}" oninput="filterHistory()"></div><div class="table-wrap"><table class="data"><thead><tr><th>${t("date")}</th><th>${t("type")||"Type"}</th><th>${t("partyName")}</th><th>${t("rice")}</th><th>${t("qty")}</th><th>${t("rate")}</th><th>${t("total")}</th><th>${lang==="or"?t("paid")+"/"+t("received"):"Paid/Received"}</th><th>${t("due")}</th></tr></thead><tbody id="historyBody">${historyRows(rows)}</tbody></table></div></div>`;
}
function historyRows(rows){if(!rows.length)return`<tr><td colspan="9" class="empty">${t("noData")}</td></tr>`;return rows.slice().reverse().map(x=>{let type=x.__type||x.Type||"",p=partyNameOf(x),d=x.date||x.Date||"",q=qtyOf(x),r=rateOf(x),tot=totalOf(x),paid=paidOf(x),due=dueOf(x);return`<tr><td>${esc(fmtDate(d))}</td><td><span class="pill">${esc(lang==="or"?(type==="Sale"?"ବିକ୍ରି":"କିଣା"):type)}</span></td><td>${esc(p)}</td><td>${esc(t("rice"))}</td><td class="num">${kg(q)}</td><td class="num">${money(r)}</td><td class="num">${money(tot)}</td><td class="num">${money(paid)}</td><td class="num">${money(due)}</td></tr>`}).join("")}
function filterHistory(){let q=($("#search").value||"").toLowerCase();let rows=[...purchases.map(x=>({...x,__type:"Purchase"})),...sales.map(x=>({...x,__type:"Sale"}))].filter(x=>partyNameOf(x).toLowerCase().includes(q));$("#historyBody").innerHTML=historyRows(rows)}
function partiesPage(){
 const map=new Map();parties.forEach(p=>{let id=partyIdOf(p),name=partyNameOf(p);if(name)map.set(String(id||name),{id,name,kg:0,amt:0,due:0})});
 [...purchases,...sales].forEach(x=>{let id=partyIdOf(x),name=partyNameOf(x);if(!name)return;let key=String(id||name),o=map.get(key)||{id,name,kg:0,amt:0,due:0};o.kg+=qtyOf(x);o.amt+=totalOf(x);o.due+=dueOf(x);map.set(key,o)});
 const a=[...map.values()];
 return `<div class="card"><div class="toolbar"><div class="grow"><h2>♟ ${t("partyMaster")}</h2><small>${t("partyHelp")}</small></div></div><div class="party-grid">${a.length?a.map(o=>`<div class="party"><div class="name">${esc(o.name)}</div><div class="meta">${esc(o.id||"")} · ${kg(o.kg)} ${t("kgTransactions")}</div><div class="amount">${money(o.amt)}</div><div class="meta">${o.due>0?t("due")+": "+money(o.due):t("paid")}</div></div>`).join(""):`<div class="empty">${t("noData")}</div>`}</div></div>`;
}
function getOpening(){try{return num(localStorage.getItem("riceOpeningStock"))}catch(e){return 0}}
function saveOpening(){let v=num($("#openingInput").value);try{localStorage.setItem("riceOpeningStock",String(v))}catch(e){}toast(t("openingSaved"));draw()}
function stockPage(){
 const opening=getOpening(),purchase=purchases.reduce((s,x)=>s+qtyOf(x),0),sales=sales.reduce((s,x)=>s+qtyOf(x),0),closing=opening+purchase-sales;
 let events=[];
 purchases.forEach(x=>events.push({date:x.date||x.Date||"",type:"purchase",party:partyNameOf(x),in:qtyOf(x),out:0}));
 sales.forEach(x=>events.push({date:x.date||x.Date||"",type:"sale",party:partyNameOf(x),in:0,out:qtyOf(x)}));
 events.sort((a,b)=>new Date(a.date)-new Date(b.date));let bal=opening;
 let rows=`<tr><td>—</td><td>${t("opening")}</td><td>—</td><td class="num">${kg(opening)}</td><td class="num">0</td><td class="num">${kg(opening)}</td></tr>`;
 events.forEach(e=>{bal+=e.in-e.out;rows+=`<tr><td>${esc(fmtDate(e.date))}</td><td>${e.type==="purchase"?t("purchase"):t("sales")}</td><td>${esc(e.party||"")}</td><td class="num">${kg(e.in)}</td><td class="num">${kg(e.out)}</td><td class="num">${kg(bal)}</td></tr>`});
 return `<div class="grid k3"><div class="card kpi"><span class="lbl">${t("opening")}</span><span class="val">${kg(opening)} KG</span></div><div class="card kpi"><span class="lbl">${t("purchase")}</span><span class="val">${kg(purchase)} KG</span></div><div class="card kpi"><span class="lbl">${t("sales")}</span><span class="val">${kg(sales)} KG</span></div></div>
 <div style="height:12px"></div><div class="card"><div class="toolbar"><div class="grow"><h2>□ ${t("stockLedger")}</h2><small>${t("rice")}</small></div><div style="display:flex;gap:8px;max-width:260px"><input id="openingInput" type="number" min="0" step=".01" value="${opening}" placeholder="${t("setOpening")}"><button class="btn primary" onclick="saveOpening()">${t("save")}</button></div></div><div style="font-size:34px;font-weight:850;margin:8px 0 14px">${kg(closing)} KG</div><div class="table-wrap"><table class="data"><thead><tr><th>${t("date")}</th><th>${t("particular")}</th><th>${t("partyName")}</th><th>${t("purchase")}</th><th>${t("sales")}</th><th>${t("balance")}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function printPage(){
 const rows=[...purchases.map(x=>({...x,__type:"Purchase"})),...sales.map(x=>({...x,__type:"Sale"}))];
 return `<div class="card"><div class="toolbar no-print"><div class="grow"><h2>▣ ${t("printTitle")}</h2><small>${t("a4")}</small></div><button class="btn primary" onclick="window.print()">▣ ${t("print")}</button></div><div style="background:#fff;color:#000;padding:20px;border-radius:16px"><h2 style="text-align:center">RICE PURCHASE & SALES REGISTER</h2><p style="text-align:center">NORMAL RICE</p><table class="data" style="min-width:0;color:#000"><thead><tr><th>${t("date")}</th><th>${t("type")||"Type"}</th><th>${t("partyName")}</th><th>KG</th><th>${t("rate")}</th><th>${t("total")}</th><th>${t("due")}</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(fmtDate(x.date||x.Date||""))}</td><td>${esc(x.__type)}</td><td>${esc(partyNameOf(x))}</td><td>${kg(qtyOf(x))}</td><td>${money(rateOf(x))}</td><td>${money(totalOf(x))}</td><td>${money(dueOf(x))}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function settingsPage(){
 return `<div class="grid k2"><div class="card"><h2>⚙ ${t("settings")}</h2><div style="height:12px"></div><label>${t("api")}</label><input value="${API}" readonly style="margin-top:6px"><div style="height:14px"></div><label>${t("opening")}</label><input id="settingsOpening" type="number" min="0" step=".01" value="${getOpening()}" style="margin-top:6px"><button class="btn primary" style="margin-top:8px" onclick="localStorage.setItem('riceOpeningStock',String(num($('#settingsOpening').value)));toast(t('openingSaved'));draw()">${t("save")}</button></div><div class="card"><h2>ℹ ${t("appInfo")}</h2><p class="muted">${t("github")}</p><p class="muted">${t("fixedRice")}</p></div></div>`;
}
function draw(){
 activeNav();applyLanguage();
 let content=page==="dashboard"?dashboard():page==="purchase"?form("purchase"):page==="sale"?form("sale"):page==="history"?history():page==="parties"?partiesPage():page==="stock"?stockPage():page==="print"?printPage():settingsPage();
 $("#root").innerHTML=content;
 if(page==="purchase"||page==="sale")bindCalc();
}
window.addEventListener("online",()=>{applyLanguage()});window.addEventListener("offline",()=>{applyLanguage()});
$("#langBtn").addEventListener("click",toggleLang);
draw();refreshAll();
</script>
</body>
</html>
