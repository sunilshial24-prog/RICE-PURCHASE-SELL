<!doctype html><html lang="or"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f4c5c"><title>ଚାଉଳ ହିସାବ / Rice Register</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui;background:#f5f7fa}input,select{font-size:16px}</style>
</head><body class="pb-20">
<header class="sticky top-0 z-20 bg-[#0f4c5c] text-white p-4 flex justify-between"><b>ଚାଉଳ ହିସାବ / Rice Register</b><button onclick="toggle()">ଓଡ଼ିଆ / English</button></header>
<main class="max-w-3xl mx-auto p-4">
<div id="dash" class="grid grid-cols-2 gap-3 mb-4"></div>
<div class="bg-white rounded-2xl p-4 shadow">
<div class="grid grid-cols-3 gap-2 mb-4">
<button onclick="page='purchase';draw()" class="p-3 rounded-xl bg-slate-100">📥 କିଣା</button>
<button onclick="page='sale';draw()" class="p-3 rounded-xl bg-slate-100">📤 ବିକ୍ରି</button>
<button onclick="page='history';draw()" class="p-3 rounded-xl bg-slate-100">🧾 ହିସାବ</button>
</div><div id="content"></div></div></main>
<script>
const API="https://script.google.com/macros/s/AKfycbyfYGKKSJa-ygV0ETNyL4CU6dJae8B7rOffCpS7GriB99-D72t2sh3TZT3GThq-qx0KCA/exec";let odia=true,page="purchase",parties=[],rows=[];
const $=x=>document.getElementById(x),money=x=>"₹"+Number(x||0).toLocaleString("en-IN",{maximumFractionDigits:2});
async function get(a){return (await fetch(API+"?action="+a)).json()}
async function post(x){return (await fetch(API,{method:"POST",body:JSON.stringify(x)})).json()}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toggle(){odia=!odia;draw()}
async function boot(){try{parties=(await get("parties")).data||[]}catch(e){}draw();dash()}
async function dash(){try{let x=await get("dashboard");$("dash").innerHTML=[["କିଣା KG / Purchase",x.purchaseQty],["ବିକ୍ରି KG / Sales",x.salesQty],["କିଣା / Purchase",money(x.purchaseValue)],["ବିକ୍ରି / Sales",money(x.salesValue)],["ଦେବା ବାକି / Payable",money(x.purchaseDue)],["ପାଇବା ବାକି / Receivable",money(x.salesDue)],["ଷ୍ଟକ୍ / Stock",x.currentStock+" KG"]].map(a=>`<div class="bg-white rounded-2xl p-4 shadow"><small>${a[0]}</small><b class="block text-xl mt-1">${a[1]}</b></div>`).join("")}catch(e){}}
function opts(){return '<option value="">ପାର୍ଟି ବାଛନ୍ତୁ / Select Party</option>'+parties.map(p=>{let id=p["Party ID"]||p.ID||"",n=p["Party Name"]||p["ପାର୍ଟି / ଗ୍ରାହକ ନାମ"]||p.Name||"";return `<option value="${esc(id)}">${esc(n)}</option>`}).join("")}
function form(type){let sale=type==="sale";return `<form onsubmit="save(event,'${type}')">
<input name="date" type="date" required class="w-full border rounded-xl p-3 mb-2" value="${new Date().toISOString().slice(0,10)}">
<select name="partyId" required class="w-full border rounded-xl p-3 mb-2">${opts()}</select>
<div class="border rounded-xl p-3 mb-2 bg-slate-50">NORMAL RICE / ସାଧାରଣ ଚାଉଳ</div>
<input type="hidden" name="riceId" value="R001"><input type="hidden" name="riceName" value="NORMAL RICE">
<input id="q" name="qty" type="number" min="0" step=".01" required placeholder="ପରିମାଣ KG / Quantity KG" class="w-full border rounded-xl p-3 mb-2">
<input id="r" name="rate" type="number" min="0" step=".01" required placeholder="ଦର / Rate per KG" class="w-full border rounded-xl p-3 mb-2">
<div class="p-3 rounded-xl bg-slate-50 mb-2">ମୋଟ / Total: <b id="total">₹0</b></div>
<input id="p" name="${sale?"received":"paid"}" type="number" min="0" step=".01" value="0" placeholder="${sale?"ପାଇଥିବା ଟଙ୍କା / Received":"ଦେଇଥିବା ଟଙ୍କା / Paid"}" class="w-full border rounded-xl p-3 mb-2">
<div class="p-3 rounded-xl bg-amber-50 mb-2">ବାକି / Due: <b id="due">₹0</b></div>
<textarea name="remarks" placeholder="ଅଧିକ ତଥ୍ୟ / Remarks" class="w-full border rounded-xl p-3 mb-2"></textarea>
<button class="w-full bg-[#0f4c5c] text-white rounded-xl p-3 font-bold">${sale?"ବିକ୍ରି ସେଭ୍ / Save Sale":"କିଣା ସେଭ୍ / Save Purchase"}</button></form>`}
function calc(){let t=(+$("q")?.value||0)*(+$("r")?.value||0),p=+$("p")?.value||0;if($("total"))$("total").textContent=money(t);if($("due"))$("due").textContent=money(Math.max(0,t-p))}
async function save(e,type){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.action=type==="sale"?"addSale":"addPurchase";let p=parties.find(z=>(z["Party ID"]||z.ID)==x.partyId);x.partyName=p?.["Party Name"]||p?.["ପାର୍ଟି / ଗ୍ରାହକ ନାମ"]||p?.Name||"";x.total=(+x.qty||0)*(+x.rate||0);x.due=Math.max(0,x.total-(+(x.paid||x.received)||0));try{let j=await post(x);alert(j.message||"Saved");e.target.reset();dash()}catch(e){alert("Connection failed")}}
async function history(){let [p,s]=await Promise.all([get("purchases"),get("sales")]);rows=[...(p.data||[]).map(x=>({...x,__type:"Purchase"})),...(s.data||[]).map(x=>({...x,__type:"Sale"}))];$("content").innerHTML=rows.slice().reverse().map(x=>{let party=x.partyName||x["Party Name"]||"—",date=x.date||x.Date||"",qty=x.qty||x["Quantity (KG)"]||0,total=x.total||x.Total||0,id=x["Transaction ID"]||x.ID||x["Purchase ID"]||x["Sale ID"]||"";return `<div class="border-b py-3"><b>${esc(party)}</b><span class="float-right">${money(total)}</span><div class="text-xs text-slate-500">${esc(date)} · ${x.__type} · ${esc(qty)} KG</div><div class="mt-2 flex gap-2"><button onclick="edit('${esc(id)}')" class="flex-1 border rounded-lg p-2">Edit / ବଦଳ</button><button onclick="del('${esc(id)}')" class="flex-1 border border-red-300 text-red-600 rounded-lg p-2">Delete / ବାତିଲ</button></div></div>`}).join("")||"No records / ତଥ୍ୟ ନାହିଁ"}
async function del(id){if(!confirm(odia?"ଏହି ତଥ୍ୟ ବାତିଲ କରିବେ କି?":"Delete this transaction?"))return;let j=await post({action:"deleteTransaction",transactionId:id,id:id});alert(j.message||"Done");history();dash()}
function edit(id){alert(odia?"Edit ପାଇଁ ନିଶ୍ଚିତ Transaction ID ଦରକାର। ପରବର୍ତ୍ତୀ backend update ରେ ଏହା ସମ୍ପୂର୍ଣ୍ଣ ହେବ।":"Edit requires a stable Transaction ID. Backend update is included for the next deployment.")}
function draw(){if(page==="history")return history();$("content").innerHTML=form(page);["q","r","p"].forEach(i=>$(i)?.addEventListener("input",calc));calc();dash()}
boot();
</script></body></html>
