<!doctype html>
<html lang="or">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">

<title>Rice Buy & Sell Register</title>
<style>
:root{--bg:#0b1220;--panel:#0f172a;--panel2:#111c34;--card:#0e1a33;--line:#1e2b4d;--line2:#243357;--text:#e5eefc;--muted:#93a4c7;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;--purple:#a855f7;--orange:#f97316;--shadow:0 10px 30px rgba(0,0,0,.30);--r:16px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"Noto Sans",sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}h1,h2,h3{margin:0}small,.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}.logo{width:40px;height:40px;border-radius:12px;background:#1e293b;display:grid;place-items:center;font-size:22px}.brand b{display:block}.brand small{font-size:11px}
.nav{display:flex;flex-direction:column;gap:3px}.group{color:#5f7297;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:12px 10px 5px}.nav button{border:0;background:transparent;text-align:left;padding:10px;border-radius:11px;color:var(--text);display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:#132446}.nav .ic{width:23px;text-align:center;font-size:17px}
.main{padding:18px;max-width:1450px;width:100%}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}.title{display:flex;align-items:center;gap:10px}.title h1{font-size:1.2rem}.badge{display:inline-flex;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#0b1730;color:var(--muted);font-size:12px}.badge.on{background:#052e1c;border-color:#166534;color:#bbf7d0}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:#0b1730;color:var(--text);font-weight:650}.btn:hover{background:#132446}.btn.primary{background:linear-gradient(180deg,#0ea5e9,#0284c7);border-color:#0284c7;color:white}.btn.ok{background:linear-gradient(180deg,#22c55e,#15803d);border-color:#15803d;color:white}.btn.warn{background:linear-gradient(180deg,#f59e0b,#b45309);border-color:#b45309;color:white}.btn.danger{background:linear-gradient(180deg,#ef4444,#991b1b);border-color:#991b1b;color:white}.btn.sm{padding:6px 9px;font-size:12px}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}.card h3{color:#cfe0ff;font-size:15px;margin-bottom:5px}
.kpi{min-height:112px;display:flex;flex-direction:column;justify-content:space-between}.kpi.blue{background:linear-gradient(180deg,#0b2545,#0c1a35)}.kpi.green{background:linear-gradient(180deg,#0b2e1c,#0c1a1a)}.kpi.orange{background:linear-gradient(180deg,#3a1c0d,#1a0f0a)}.kpi.purple{background:linear-gradient(180deg,#26113f,#100a20)}.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.kpi .val{font-size:1.65rem;font-weight:850}.kpi .sub{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#0b1730;border-radius:13px;padding:14px 10px;text-align:left}.quick button b{display:block;margin-top:7px}.quick button small{display:block;margin-top:2px}
.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea,input,select,textarea{background:#0b1730;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,189,248,.12)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.calc .box{background:#08122a;border:1px dashed var(--line2);border-radius:12px;padding:11px}.calc .box small{display:block}.calc .box b{font-size:1.25rem;display:block;margin-top:3px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}.grow{flex:1}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.data{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}.data th,.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.data th{background:#0e1a33;color:#cfe0ff;position:sticky;top:0}.data td.num{text-align:right}.pill{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}.pill.buy{background:#052e1c;color:#bbf7d0;border-color:#166534}.pill.sell{background:#3a1c0d;color:#fed7aa;border-color:#9a3412}.pill.due{background:#3b2b06;color:#fde68a;border-color:#a16207}.pill.paid{background:#052e1c;color:#bbf7d0;border-color:#166534}
.party-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.party{background:#0b1730;border:1px solid var(--line);border-radius:13px;padding:12px}.party .name{font-weight:750}.party .meta{font-size:12px;color:var(--muted);margin-top:4px}.party .amount{font-size:16px;font-weight:800;margin-top:9px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bottom{display:none}.menu{display:none}.hide{display:none!important}
.toast{position:fixed;right:15px;bottom:75px;z-index:100;background:#0e1a33;border:1px solid var(--line2);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow)}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;width:78%;max-width:320px;transform:translateX(-105%);z-index:80;transition:.18s}.sidebar.open{transform:none}.main{padding:14px 12px 92px}.menu{display:inline-flex}.k4{grid-template-columns:repeat(2,1fr)}.k3{grid-template-columns:1fr}.k2{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.party-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.calc{grid-template-columns:1fr 1fr}.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;background:#0b1730;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.bottom button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px 3px}.bottom button.active{color:#fff}.bottom span{display:block;font-size:18px;margin-bottom:2px}}
@media(max-width:430px){.kpi .val{font-size:1.35rem}.calc{grid-template-columns:1fr}.topbar .actions .btn{padding:7px 9px}}

@media print{body{background:#fff;color:#111}.sidebar,.topbar,.bottom,.actions,.btn,.badge{display:none!important}.main{padding:0}.card{background:#fff;color:#111;border:1px solid #111;box-shadow:none}.data th,.data td{color:#111;background:#fff;border-color:#111}.data th{position:static}}
""</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">🍚</div><div><b>Rice Buy & Sell</b><small>କିଣା–ବିକ୍ରି ହିସାବ</small></div></div>
  <div class="nav">
    <div class="group">Main / ମୁଖ୍ୟ</div>
    <button data-page="dashboard"><span class="ic">🏠</span>Dashboard / ଡ୍ୟାସବୋର୍ଡ</button>
    <button data-page="purchase"><span class="ic">📥</span>Purchase / କିଣା</button>
    <button data-page="sale"><span class="ic">📤</span>Sales / ବିକ୍ରି</button>
    <button data-page="history"><span class="ic">🧾</span>History / ହିସାବ</button>
    <button data-page="parties"><span class="ic">👥</span>Parties / ପାର୍ଟି</button>
    <button data-page="stock"><span class="ic">📦</span>Stock / ଷ୍ଟକ୍</button>
    <button data-page="print"><span class="ic">🖨️</span>Print / ପ୍ରିଣ୍ଟ</button>
    <div class="group">System / ସିଷ୍ଟମ୍</div>
    <button data-page="settings"><span class="ic">⚙️</span>Settings / ସେଟିଂ</button>
  </div>
</aside>

<main class="main">
<header class="topbar">
  <div class="title"><button class="btn sm menu" onclick="toggleMenu()">☰</button><h1 id="pageTitle">Dashboard / ଡ୍ୟାସବୋର୍ଡ</h1><span class="badge on">NORMAL RICE</span></div>
  <div class="actions"><span class="badge" id="online">● Online</span><button class="btn sm" id="langBtn" type="button">ଓଡ଼ିଆ / English</button><button class="btn sm" onclick="refreshAll()">↻ Refresh</button></div>
</header>
<div id="root"></div>
</main>
</div>

<nav class="bottom">
<button data-page="dashboard"><span>🏠</span>Home</button>
<button data-page="purchase"><span>📥</span>Purchase</button>
<button data-page="sale"><span>📤</span>Sales</button>
<button data-page="history"><span>🧾</span>History</button>
<button data-page="stock"><span>📦</span>Stock</button>
</nav>

<script>
const API="https://script.google.com/macros/s/AKfycbwpu7XHWFM-SX23H2TCcpAWCJeauHy7fKFokNx8N_JTugC9WTlYsi2aPvlmj-x6kyTZDQ/exec";
let page="dashboard", lang="or", parties=[], purchases=[], sales=[], dashboardData={};
try { lang = localStorage.getItem("riceRegisterLang") || "or"; } catch(e) {}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const qty=n=>Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmtDate(x){if(!x)return "";let d=new Date(x);if(!isNaN(d))return d.toLocaleDateString("en-GB");return String(x).replace(/T.*Z?$/,"")}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
async function apiJson(url, options){
  const r = await fetch(url, options);
  const text = await r.text();
  let j;
  try { j = JSON.parse(text); }
  catch(e){ throw new Error(text || ("HTTP "+r.status)); }
  if(!r.ok || j.success===false) throw new Error(j.message || ("HTTP "+r.status));
  return j;
}
async function get(a){
  return apiJson(API+"?action="+encodeURIComponent(a)+"&_="+Date.now(), {
    method:"GET",
    cache:"no-store"
  });
}
async function post(x){
  return apiJson(API, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(x)
  });
}
function arr(j){
  if(Array.isArray(j)) return j;
  if(Array.isArray(j.data)) return j.data;
  if(Array.isArray(j.rows)) return j.rows;
  if(Array.isArray(j.records)) return j.records;
  return [];
}
function num(...v){
  for(const x of v){
    if(x!==undefined && x!==null && x!==""){
      const n=Number(String(x).replace(/,/g,"").replace(/[₹]/g,""));
      if(Number.isFinite(n)) return n;
    }
  }
  return 0;
}
function partyIdOf(p){return p["Party ID"]??p["PartyID"]??p.ID??p.partyId??p.party_id??""}
function partyNameOf(p){return p["Party Name / ପାର୍ଟି ନାମ"]??p["Party Name"]??p["Party Name/ପାର୍ଟି ନାମ"]??p["ପାର୍ଟି / ଗ୍ରାହକ ନାମ"]??p.Name??p.partyName??p.party_name??""}
function qtyOf(x){return num(x.qty,x["Qty (KG)"],x["Quantity (KG)"],x.Quantity,x.quantity,x["KG"])}
function rateOf(x){return num(x.rate,x["Rate / KG"],x.Rate,x.ratePerKg,x["Rate/KG"])}
function totalOf(x){return num(x.total,x["Total Amount"],x.Total,x.Amount,x["Total"])}
function paidOf(x){return num(x.paid,x.received,x.Paid,x.Received,x["Paid/Received"],x["Amount Paid"],x["Amount Received"])}
function dueOf(x){return num(x.due,x.Due,x["Remaining Amount"],x.Balance,x["Balance Amount"])}
function toggleMenu(){$("#sidebar").classList.toggle("open")}
function toggleLang(){
  lang = lang === "or" ? "en" : "or";
  try { localStorage.setItem("riceRegisterLang", lang); } catch(e) {}
  draw();
  updateLanguageButton();
}
function updateLanguageButton(){
  const b=document.getElementById("langBtn");
  if(b) b.textContent = lang==="or" ? "English / ଓଡ଼ିଆ" : "ଓଡ଼ିଆ / English";
}
function setPage(p){page=p;toggleMenu();draw()}
$$("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
function activeNav(){$$("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
async function refreshAll(){
  try{
    const [pa,pu,sa,da]=await Promise.all([
      get("parties"), get("purchases"), get("sales"), get("dashboard")
    ]);
    parties=arr(pa);
    purchases=arr(pu);
    sales=arr(sa);
    dashboardData=da?.data && !Array.isArray(da.data) ? da.data : (da||{});
    draw();
  }catch(e){
    console.error(e);
    toast((lang==="or"?"Google Sheet ସଂଯୋଗ ବିଫଳ: ":"Google Sheet connection failed: ")+e.message);
  }
}
function partyOptions(){
  return `<option value="">${lang==="or"?"ପାର୍ଟି ବାଛନ୍ତୁ":"Select Party"}</option>`+
    parties.map(p=>`<option value="${esc(partyIdOf(p))}">${esc(partyNameOf(p))}</option>`).join("");
}
function form(type){
 let sale=type==="sale", title=sale?(lang==="or"?"ବିକ୍ରି ଏଣ୍ଟ୍ରି":"Sales Entry"):(lang==="or"?"କିଣା ଏଣ୍ଟ୍ରି":"Purchase Entry");
 return `<div class="card"><div class="toolbar"><div class="grow"><h2>${title}</h2><small>🍚 NORMAL RICE / ସାଧାରଣ ଚାଉଳ</small></div><span class="badge">${sale?"SELL / ବିକ୍ରି":"BUY / କିଣା"}</span></div>
 <form class="form" onsubmit="saveEntry(event,'${type}')">
 <div class="row"><label>${lang==="or"?"ତାରିଖ / Date":"Date / ତାରିଖ"}</label><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="row"><label>${sale?"ଗ୍ରାହକ / Customer":"ସପ୍ଲାୟର / Supplier"}</label><select name="partyId" required>${partyOptions()}</select></div>
 <input type="hidden" name="riceId" value="R001"><input type="hidden" name="riceName" value="NORMAL RICE">
 <div class="row"><label>${lang==="or"?"ପରିମାଣ (KG) / Quantity":"Quantity (KG) / ପରିମାଣ"}</label><input id="qty" name="qty" type="number" min="0" step=".01" required placeholder="0.00"></div>
 <div class="row"><label>${lang==="or"?"ଦର / Rate per KG":"Rate per KG / ଦର"}</label><input id="rate" name="rate" type="number" min="0" step=".01" required placeholder="0.00"></div>
 <div class="calc"><div class="box"><small>${lang==="or"?"ମୋଟ ଟଙ୍କା":"Total Amount"}</small><b id="total">₹0</b></div><div class="box"><small>${sale?(lang==="or"?"ପାଇଥିବା ଟଙ୍କା":"Received"):lang==="or"?"ଦେଇଥିବା ଟଙ୍କା":"Paid"}</small><input id="paid" name="${sale?"received":"paid"}" type="number" min="0" step=".01" value="0"></div><div class="box"><small>${lang==="or"?"ବାକି":"Due"}</small><b id="due">₹0</b></div></div>
 <div class="row"><label>${lang==="or"?"ଟଙ୍କା ଦେବା ଉପାୟ":"Payment Mode"}</label><select name="paymentMode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Other</option></select></div>
 <div class="row"><label>${lang==="or"?"ଅଧିକ ତଥ୍ୟ":"Remarks"}</label><textarea name="remarks" rows="2" placeholder="${lang==="or"?"ଦରକାର ହେଲେ ଲେଖନ୍ତୁ":"Optional remarks"}"></textarea></div>
 <div class="actions"><button class="btn primary" type="submit">💾 ${sale?(lang==="or"?"ବିକ୍ରି ସେଭ୍ କରନ୍ତୁ":"Save Sale"):(lang==="or"?"କିଣା ସେଭ୍ କରନ୍ତୁ":"Save Purchase")}</button><button type="button" class="btn" onclick="setPage('history')">🧾 ${lang==="or"?"ହିସାବ ଦେଖନ୍ତୁ":"View History"}</button></div>
 </form></div>`
}
function bindCalc(){["qty","rate","paid"].forEach(id=>$("#"+id)?.addEventListener("input",()=>{let t=(+$("#qty").value||0)*(+$("#rate").value||0),p=+$("#paid").value||0;$("#total").textContent=money(t);$("#due").textContent=money(Math.max(0,t-p))}));}
async function saveEntry(e,type){
  e.preventDefault();
  const x=Object.fromEntries(new FormData(e.target));
  const p=parties.find(z=>String(partyIdOf(z))===String(x.partyId||""));
  const partyName=partyNameOf(p||{});
  const qtyVal=num(x.qty), rateVal=num(x.rate);
  const amount=qtyVal*rateVal;
  const paidVal=type==="sale"?num(x.received):num(x.paid);
  const dueVal=Math.max(0,amount-paidVal);
  const date=x.date || new Date().toISOString().slice(0,10);

  const payload = {
    action: type==="sale" ? "addSale" : "addPurchase",
    type: type==="sale" ? "Sale" : "Purchase",
    date: date,
    partyId: x.partyId,
    partyName: partyName,
    riceId: "R001",
    riceName: "NORMAL RICE",
    qty: qtyVal,
    rate: rateVal,
    total: amount,
    paid: type==="sale" ? 0 : paidVal,
    received: type==="sale" ? paidVal : 0,
    due: dueVal,
    paymentMode: x.paymentMode || "Cash",
    remarks: x.remarks || "",
    // Exact workbook-style aliases:
    "Date": date,
    "Party ID": x.partyId,
    "Party Name": partyName,
    "Rice ID": "R001",
    "Rice Name": "NORMAL RICE",
    "Qty (KG)": qtyVal,
    "Rate / KG": rateVal,
    "Total Amount": amount,
    "Paid": type==="sale" ? 0 : paidVal,
    "Received": type==="sale" ? paidVal : 0,
    "Due": dueVal,
    "Payment Mode": x.paymentMode || "Cash",
    "Remarks": x.remarks || ""
  };

  try{
    const j=await post(payload);
    toast(lang==="or"?"ତଥ୍ୟ ସଫଳତାର ସହିତ ସେଭ୍ ହେଲା":"Entry saved successfully");
    e.target.reset();
    await refreshAll();
    setPage("history");
  }catch(err){
    console.error(err);
    toast((lang==="or"?"ସେଭ୍ ବିଫଳ: ":"Save failed: ")+err.message);
  }
}
function dashboard(){
 let d=dashboardData||{},pq=num(d.purchaseQty,d.purchaseKG,d["Purchase KG"]),sq=num(d.salesQty,d.salesKG,d["Sales KG"]),pv=num(d.purchaseValue,d["Purchase Value"]),sv=num(d.salesValue,d["Sales Value"]),pd=num(d.purchaseDue,d.payable,d["Supplier Due"]),sd=num(d.salesDue,d.receivable,d["Customer Due"]),st=num(d.currentStock,d.closingStock,d["Closing Stock"]);
 return `<div class="grid k4"><div class="card kpi blue"><span class="lbl">📥 ${lang==="or"?"ମୋଟ କିଣା":"Purchase Qty"}</span><span class="val">${qty(pq)} KG</span><span class="sub">${money(pv)} value</span></div><div class="card kpi green"><span class="lbl">📤 ${lang==="or"?"ମୋଟ ବିକ୍ରି":"Sales Qty"}</span><span class="val">${qty(sq)} KG</span><span class="sub">${money(sv)} value</span></div><div class="card kpi orange"><span class="lbl">💰 ${lang==="or"?"ଦେବା ବାକି":"Payable"}</span><span class="val">${money(pd)}</span><span class="sub">${lang==="or"?"ସପ୍ଲାୟରଙ୍କୁ ଦେବା":"To suppliers"}</span></div><div class="card kpi purple"><span class="lbl">💵 ${lang==="or"?"ପାଇବା ବାକି":"Receivable"}</span><span class="val">${money(sd)}</span><span class="sub">${lang==="or"?"ଗ୍ରାହକଙ୍କଠାରୁ ପାଇବା":"From customers"}</span></div></div>
 <div style="height:12px"></div><div class="card"><div class="toolbar"><div class="grow"><h3>⚡ ${lang==="or"?"ଦ୍ରୁତ କାମ":"Quick Actions"}</h3><small>${lang==="or"?"ଦୈନିକ କାମ ପାଇଁ":"For daily work"}</small></div><span class="badge on">● ${navigator.onLine?"Online":"Offline"}</span></div>
 <div class="quick"><button onclick="setPage('purchase')">📥<b>${lang==="or"?"ଚାଉଳ କିଣନ୍ତୁ":"New Purchase"}</b><small>${lang==="or"?"ସପ୍ଲାୟରଠାରୁ":"From supplier"}</small></button><button onclick="setPage('sale')">📤<b>${lang==="or"?"ଚାଉଳ ବିକ୍ରି":"New Sale"}</b><small>${lang==="or"?"ଗ୍ରାହକ / A-Party":"Customer / A-Party"}</small></button><button onclick="setPage('history')">🧾<b>${lang==="or"?"ହିସାବ ତାଲିକା":"Transactions"}</b><small>${lang==="or"?"ସମସ୍ତ ଏଣ୍ଟ୍ରି":"All entries"}</small></button><button onclick="setPage('parties')">👥<b>${lang==="or"?"ପାର୍ଟି":"Party Master"}</b><small>${lang==="or"?"ଗ୍ରାହକ / ସପ୍ଲାୟର":"Customers / Suppliers"}</small></button></div></div>
 <div style="height:12px"></div><div class="grid k2"><div class="card"><h3>📊 ${lang==="or"?"ଷ୍ଟକ୍ ସ୍ଥିତି":"Stock Position"}</h3><div style="font-size:2rem;font-weight:850;margin-top:10px">${qty(st)} KG</div><small>${lang==="or"?"କିଣା − ବିକ୍ରି":"Purchase − Sales"}</small></div><div class="card"><h3>🧾 ${lang==="or"?"ଆଜିର ଧ୍ୟାନ":"Today's Focus"}</h3><div style="margin-top:10px;display:grid;gap:8px"><button class="btn" onclick="setPage('history')">🔎 ${lang==="or"?"ବାକି ହିସାବ ଦେଖନ୍ତୁ":"Check outstanding dues"}</button><button class="btn" onclick="setPage('print')">🖨️ ${lang==="or"?"ରେଜିଷ୍ଟର ପ୍ରିଣ୍ଟ କରନ୍ତୁ":"Print register"}</button></div></div></div>`
}
function history(){
 let rows=[...purchases.map(x=>({...x,__type:"Purchase"})),...sales.map(x=>({...x,__type:"Sale"}))];
 return `<div class="card"><div class="toolbar"><div class="grow"><h2>${lang==="or"?"ଲେନଦେନ ହିସାବ":"Transaction History"}</h2><small>${rows.length} ${lang==="or"?"ଟି ରେକର୍ଡ":"records"}</small></div><input id="search" oninput="filterHistory()" style="max-width:260px" placeholder="${lang==="or"?"ପାର୍ଟି ଖୋଜନ୍ତୁ":"Search party"}"></div><div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Type</th><th>Party</th><th>Rice</th><th>KG</th><th>Rate</th><th>Total</th><th>Paid/Received</th><th>Due</th></tr></thead><tbody id="historyBody">${historyRows(rows)}</tbody></table></div></div>`
}
function historyRows(rows){if(!rows.length)return `<tr><td colspan="9" class="empty">No transactions / କୌଣସି ତଥ୍ୟ ନାହିଁ</td></tr>`;return rows.slice().reverse().map(x=>{let type=x.__type||x.Type||"",party=partyNameOf(x),date=x.date||x.Date||"",q=qtyOf(x),r=rateOf(x),t=totalOf(x),p=paidOf(x),d=dueOf(x);return `<tr><td>${esc(fmtDate(date))}</td><td><span class="pill ${type.toLowerCase().includes("sale")?"sell":"buy"}">${esc(type)}</span></td><td>${esc(party)}</td><td>NORMAL RICE</td><td class="num">${qty(q)}</td><td class="num">${money(r)}</td><td class="num">${money(t)}</td><td class="num">${money(p)}</td><td class="num"><span class="pill ${Number(d)>0?"due":"paid"}">${money(d)}</span></td></tr>`}).join("")}
function filterHistory(){let q=($("#search").value||"").toLowerCase(),rows=[...purchases.map(x=>({...x,__type:"Purchase"})),...sales.map(x=>({...x,__type:"Sale"}))].filter(x=>String(x.partyName||x["Party Name"]||x["Party Name / ପାର୍ଟି ନାମ"]||"").toLowerCase().includes(q));$("#historyBody").innerHTML=historyRows(rows)}
function partiesPage(){let map=new Map();[...purchases,...sales].forEach(x=>{let n=partyNameOf(x);if(!n)return;let o=map.get(n)||{name:n,kg:0,amt:0,due:0};o.kg+=qtyOf(x);o.amt+=totalOf(x);o.due+=dueOf(x);map.set(n,o)});let arr=[...map.values()];return `<div class="card"><div class="toolbar"><div class="grow"><h2>👥 Party Master / ପାର୍ଟି</h2><small>${lang==="or"?"ଲେନଦେନ ଅନୁସାରେ ପାର୍ଟି":"Parties from transactions"}</small></div><button class="btn primary" onclick="toast('Add Party can be connected to PARTY MASTER')">＋ Add Party</button></div><div class="party-grid">${arr.length?arr.map(o=>`<div class="party"><div class="name">${esc(o.name)}</div><div class="meta">${qty(o.kg)} KG transactions</div><div class="amount">${money(o.amt)}</div><div class="meta">${o.due>0?"Due / ବାକି: "+money(o.due):"Paid / ସବୁ ଦିଆସରିଛି"}</div></div>`).join(""):`<div class="empty">No parties / ପାର୍ଟି ତଥ୍ୟ ନାହିଁ</div>`}</div></div>`}
function stockPage(){let st=Number(dashboardData.currentStock||0);return `<div class="grid k3"><div class="card kpi blue"><span class="lbl">Opening / ଆରମ୍ଭ</span><span class="val">—</span></div><div class="card kpi green"><span class="lbl">Purchase / କିଣା</span><span class="val">${qty(dashboardData.purchaseQty)} KG</span></div><div class="card kpi orange"><span class="lbl">Sales / ବିକ୍ରି</span><span class="val">${qty(dashboardData.salesQty)} KG</span></div></div><div style="height:12px"></div><div class="card"><h2>📦 Closing Stock / ବାକି ଷ୍ଟକ୍</h2><div style="font-size:2.4rem;font-weight:900;margin-top:10px">${qty(st)} KG</div><small>Normal Rice / ସାଧାରଣ ଚାଉଳ</small></div>`}
function printPage(){return `<div class="card"><div class="toolbar"><div class="grow"><h2>🖨️ Print Register / ପ୍ରିଣ୍ଟ</h2><small>${lang==="or"?"A4 ପ୍ରିଣ୍ଟ ପାଇଁ":"For A4 printing"}</small></div><button class="btn primary" onclick="window.print()">🖨️ Print</button></div><div class="card" style="background:white;color:#111;margin-top:10px"><h2 style="text-align:center;color:#111">RICE PURCHASE & SALES REGISTER</h2><p style="text-align:center;color:#333">NORMAL RICE / ସାଧାରଣ ଚାଉଳ</p>${printTable()}</div></div>`}
function printTable(){let rows=[...purchases.map(x=>({...x,__type:"Purchase"})),...sales.map(x=>({...x,__type:"Sale"}))];return `<table class="data" style="min-width:0;color:#111"><thead><tr><th>Date</th><th>Type</th><th>Party</th><th>KG</th><th>Rate</th><th>Total</th><th>Paid</th><th>Due</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(fmtDate(x.date||x.Date||""))}</td><td>${esc(x.__type)}</td><td>${esc(x.partyName||x["Party Name"]||x["Party Name / ପାର୍ଟି ନାମ"]||"")}</td><td>${qty(qtyOf(x))}</td><td>${money(rateOf(x))}</td><td>${money(totalOf(x))}</td><td>${money(paidOf(x))}</td><td>${money(dueOf(x))}</td></tr>`).join("")}</tbody></table>`}
function settings(){return `<div class="grid k2"><div class="card"><h2>⚙️ Settings / ସେଟିଂ</h2><div style="height:12px"></div><div class="field"><label>Google Apps Script API</label><input value="${API}" readonly></div><div style="height:10px"></div><div class="field"><label>Rice Type / ଚାଉଳ</label><input value="NORMAL RICE / ସାଧାରଣ ଚାଉଳ" readonly></div></div><div class="card"><h2>ℹ️ App</h2><p class="muted">GitHub Pages + Google Sheets</p><p class="muted">All purchase and sales records use one fixed rice type: NORMAL RICE.</p></div></div>`}
function draw(){activeNav();updateLanguageButton();let titles={dashboard:"Dashboard / ଡ୍ୟାସବୋର୍ଡ",purchase:"Purchase / କିଣା",sale:"Sales / ବିକ୍ରି",history:"History / ହିସାବ",parties:"Parties / ପାର୍ଟି",stock:"Stock / ଷ୍ଟକ୍",print:"Print / ପ୍ରିଣ୍ଟ",settings:"Settings / ସେଟିଂ"};$("#pageTitle").textContent=titles[page];let content=page==="dashboard"?dashboard():page==="purchase"?form("purchase"):page==="sale"?form("sale"):page==="history"?history():page==="parties"?partiesPage():page==="stock"?stockPage():page==="print"?printPage():settings();$("#root").innerHTML=content;if(page==="purchase"||page==="sale")bindCalc()}
function updateOnline(){let o=navigator.onLine;$("#online").textContent=o?"● Online":"● Offline";$("#online").classList.toggle("on",o)}
window.addEventListener("online",updateOnline);window.addEventListener("offline",updateOnline);
document.getElementById("langBtn")?.addEventListener("click", toggleLang);
refreshAll();updateOnline();updateLanguageButton();
</script>
</body></html>
